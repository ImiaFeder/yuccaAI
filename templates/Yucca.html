<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yucca AI - 3D Model Viewer & Speech Transcription</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r126/three.min.js"></script>
    <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.socket.io/4.5.3/socket.io.min.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: url('../static/UC.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center; /* Default to center horizontally */
            align-items: flex-start;
            height: 100vh;
            color: #fff;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.2);
            padding: 20px;
        }

        @media (min-width: 768px) {
            body {
                justify-content: center; /* Center horizontally for larger screens */
                align-items: center; /* Center vertically for larger screens */
            }
        }

    
        .container {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.4);
            padding: 20px;
            width: 90%;
            max-width: 480px;
            text-align: center; /* Pindahkan teks di dalam kontainer ke kiri */
            animation: fadeIn 1s ease-out;
        }

        #threejs-container {
            width: 100%;
            height: 300px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 32px;
            margin: 15px 0;
            background: linear-gradient(90deg, #ff5722, #e64a19);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .captions,
        .gemini-response {
            font-size: 18px;
            color: #333;
            margin: 10px 0;
        }

        .mic-button {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #ff5722, #ff9100);
            color: #fff;
            padding: 14px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
            border: none;
        }

        .mic-button:hover {
            transform: scale(1.1);
            box-shadow: 0px 4px 20px rgba(255, 87, 34, 0.8);
            background-color: #ff9800;
        }

        .mic {
            width: 28px;
            height: 28px;
            background-color: #fff;
            border-radius: 50%;
            margin-right: 12px;
            box-shadow: 0px 0px 6px rgba(0, 0, 0, 0.3);
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        select {
            background-color: #fff;
            border-radius: 10px;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ddd;
            width: 100%;
            font-size: 16px;
            color: #333;
            cursor: pointer;
        }

        .loading-bar {
            background: linear-gradient(90deg, #00bcd4, #03a9f4);
            height: 8px;
            width: 0%;
            transition: width 0.3s ease-in-out;
            margin: 20px 0;
            border-radius: 4px;
        }

        .mic-button span {
            margin-left: 12px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media screen and (max-width: 600px) {
            .container {
                width: 100%;
                margin: 20px;
            }

            #threejs-container {
                height: 250px;
            }

            h1 {
                font-size: 28px;
            }

            .mic-button {
                padding: 12px 25px;
            }

            .mic-button span {
                margin-left: 8px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 3D Model Viewer -->
        <div id="threejs-container"></div>

        <!-- Three.js Script -->
        <script>
            // Three.js Setup
            const container = document.getElementById('threejs-container');

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);

            const camera = new THREE.PerspectiveCamera(75, container.offsetWidth / 300, 0.1, 1000);
            camera.position.z = 5;

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.offsetWidth, 300);
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            // Load 3D Model
            const loader = new THREE.GLTFLoader();
            let model;

            loader.load(
                '../static/Yucca2.glb',
                (gltf) => {
                    model = gltf.scene;
                    model.scale.set(3, 3, 3);
                    scene.add(model);
                },
                undefined,
                (error) => console.error('An error occurred', error)
            );

            // Animation Loop
            const animate = () => {
                requestAnimationFrame(animate);

                if (model) {
                    model.rotation.y += 0.01;
                }

                renderer.render(scene, camera);
            };

            animate();
        </script>

        <!-- Text-to-Speech Model Selection -->
        <section class="tts-section">
            <label for="models">Choose a model:</label>
            <select id="models" name="models">
                <option value="aura-asteria-en">Asteria (Female US English)</option>
              
            </select>
        </section>

        <!-- Information and Actions -->
        <section class="information-section">
            <img class="click" src="../static/click.png" style="display: none" />
            <div class="button-container">
                <input type="checkbox" id="record" class="mic-checkbox" />
                <label for="record" class="mic-button">
                    <div class="mic">
                        <div class="mic-base"></div>
                    </div>
                    <div class="button-message">
                        <span>&nbsp;</span>
                        <span>START</span>
                    </div>
                </label>
            </div>
        </section>

        <h1>Yucca AI</h1>
        <div class="captions" id="captions">
            <span>Realtime speech transcription API</span>
        </div>

        <h2>Response</h2>
        <div class="gemini-response" id="gemini-response">
            <span>Waiting for Yucca...</span>
        </div>
    </div>

    <script src="../static/script.js"></script>
    <script src="../static/client.js"></script>
</body>

</html>
