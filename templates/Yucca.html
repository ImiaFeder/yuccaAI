<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yucca AI - 3D Model Viewer & Speech Transcription</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r126/three.min.js"></script>
    <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.socket.io/4.5.3/socket.io.min.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: url('../static/UC.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
            padding: 0;
            width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-left: 50px;
            animation: fadeIn 1s ease-out;
        }

        #threejs-container {
            width: 100%;
            height: 300px;
            border-radius: 16px 16px 0 0;
            overflow: hidden;
        }

        h1 {
            font-size: 28px;
            margin: 15px 0 10px;
            text-align: center;
            background: linear-gradient(90deg, #ff5722, #e64a19);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .captions,
        .gemini-response {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin: 10px 0;
        }

        .button-container {
            text-align: center;
            margin: 15px 0;
        }

        .mic-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #ff5722, #e64a19);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        .mic-button:hover {
            transform: scale(1.05);
            box-shadow: 0px 0px 12px rgba(255, 87, 34, 0.8);
        }

        .mic {
            width: 22px;
            height: 22px;
            background-color: #fff;
            border-radius: 50%;
            margin-right: 10px;
        }

        .loading-bar {
            background: linear-gradient(90deg, #00bcd4, #03a9f4);
            height: 5px;
            width: 0%;
            transition: width 0.2s ease-in-out;
            margin: 10px 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 3D Model Viewer -->
        <div id="threejs-container"></div>

        <!-- Three.js Script -->
        <script>
            // Three.js Setup
            const container = document.getElementById('threejs-container');

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);

            const camera = new THREE.PerspectiveCamera(75, container.offsetWidth / 300, 0.1, 1000);
            camera.position.z = 5;

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.offsetWidth, 300);
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            // Load 3D Model
            const loader = new THREE.GLTFLoader();
            let model;

            loader.load(
                '../static/Yucca2.glb',
                (gltf) => {
                    model = gltf.scene;
                    model.scale.set(3, 3, 3);
                    scene.add(model);
                },
                undefined,
                (error) => console.error('An error occurred', error)
            );

            // Animation Loop
            const animate = () => {
                requestAnimationFrame(animate);

                if (model) {
                    model.rotation.y += 0.01;
                }

                renderer.render(scene, camera);
            };

            animate();
        </script>

        <!-- Text-to-Speech Model Selection -->
        <section class="tts-section">
            <label for="models">Choose a model:</label>
            <select id="models" name="models">
                <option value="aura-asteria-en">Asteria (Female US English)</option>
                <option value="aura-luna-en">Luna (Female US English)</option>
                <option value="aura-stella-en">Stella (Female US English)</option>
                <option value="aura-athena-en">Athena (Female UK English)</option>
                <option value="aura-hera-en">Hera (Female US English)</option>
                <option value="aura-orion-en">Orion (Male US English)</option>
                <option value="aura-arcas-en">Arcas (Male US English)</option>
                <option value="aura-perseus-en">Perseus (Male US English)</option>
                <option value="aura-angus-en">Angus (Male Irish English)</option>
                <option value="aura-orpheus-en">Orpheus (Male US English)</option>
                <option value="aura-helios-en">Helios (Male UK English)</option>
                <option value="aura-zeus-en">Zeus (Male US English)</option>
            </select>
        </section>

        <!-- Information and Actions -->
        <section class="information-section">
            <img class="click" src="../static/click.png" style="display: none" />
            <div class="button-container">
                <input type="checkbox" id="record" class="mic-checkbox" />
                <label for="record" class="mic-button">
                    <div class="mic">
                        <div class="mic-base"></div>
                    </div>
                    <div class="button-message">
                        <span>&nbsp;</span>
                        <span>START</span>
                    </div>
                </label>
            </div>
        </section>

        <h1>Yucca AI</h1>
        <div class="captions" id="captions">
            <span>Realtime speech transcription API</span>
        </div>

        <h2>Response</h2>
        <div class="gemini-response" id="gemini-response">
            <span>Waiting for Yucca...</span>
        </div>
    </div>

    <script src="../static/script.js"></script>
    <script src="../static/client.js"></script>
</body>

</html>
